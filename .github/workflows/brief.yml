name: Morning Brief

on:
  schedule:
    # 11:00 UTC = ~7am ET (EDT) / ~6am ET (EST), weekdays — before the US open.
    # GitHub cron is fixed UTC, so the ET time shifts ~1h across daylight-saving.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:  # Allow manual trigger from the Actions UI

permissions:
  contents: write  # Required to commit the saved brief + dedup store back

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate and send morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BRIEF_MODEL: claude-opus-4-7
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
        run: python -m src.main brief

      # The brief file holds portfolio commentary — keep it OUT of this public repo.
      # Cache it (same-day key) so only the evening wrap can read it back.
      - name: Cache today's brief for the evening wrap
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/briefs
          key: brief-${{ steps.date.outputs.date }}

      # The dedup store is just content hashes (not sensitive) and must accumulate
      # across days, so commit it back like the triage state.
      - name: Commit dedup store back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brief_seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dedup store change to commit"
          else
            git commit -m "brief dedup: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
              sleep 5
            done
            echo "::warning::Failed to push dedup store after 3 retries"
          fi
