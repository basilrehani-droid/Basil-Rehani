name: Evening Wrap

on:
  schedule:
    # 21:30 UTC = 5:30pm ET (EDT) / 4:30pm ET (EST), weekdays — after the US close.
    # GitHub cron is fixed UTC, so the ET time shifts ~1h across daylight-saving.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:  # Allow manual trigger from the Actions UI

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Restore this morning's brief (cached by the Morning Brief workflow) so the
      # wrap can reconcile the day against it. Best-effort: if absent, runs without it.
      - name: Restore today's morning brief
        uses: actions/cache/restore@v4
        with:
          path: data/briefs
          key: brief-${{ steps.date.outputs.date }}

      - name: Generate and send evening wrap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BRIEF_MODEL: claude-opus-4-7
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
        run: python -m src.main eod
