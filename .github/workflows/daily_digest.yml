name: Daily Digest

on:
  schedule:
    # 22:30 UTC Mon-Fri = 5:30pm EST / 6:30pm EDT — after the close in both seasons.
    # GitHub Actions cron can be delayed 5-20 min, which is fine for a daily email.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write  # Required to commit the cleared digest file back

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          # ANTHROPIC_API_KEY is required by config.load_config() even though
          # the digest command doesn't call Claude. Set it to satisfy the check.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python -m src.main digest

      - name: Commit cleared digest back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
          else
            git commit -m "digest: sent $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
                exit 0
              fi
              sleep 5
            done
          fi
